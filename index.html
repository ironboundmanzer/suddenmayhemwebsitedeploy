<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudden Mayhem</title>
<meta name="description" content="Sudden Mayhem is an indie game studio. Huntin' Buddies, No Dad I Am Not Drunk, Welcome to Earth and more.">
<link rel="canonical" href="https://www.suddenmayhem.com/">
<meta property="og:title" content="Sudden Mayhem">
<meta property="og:description" content="Indie games that go wrong fast.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.suddenmayhem.com/">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one black stage; a white electric orb bursts into floating game blobs; a clicked blob grows into a card on the left. */
  --bg:#000;
  --ink:#fff;
  --dim:#8d8d96;
  --faint:#3a3a40;
  --panel:#0b0b0d;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sr a:focus{position:fixed;left:16px;top:16px;width:auto;height:auto;clip-path:none;background:var(--ink);color:#000;padding:8px 12px;z-index:30;font-family:var(--mono);font-size:13px}

#orb,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#orb{z-index:0;transition:opacity .35s}
#orb.off{opacity:0;visibility:hidden}
#orbfb{position:fixed;z-index:0;border-radius:50%;display:none;
  background:radial-gradient(circle at 38% 34%,#fff 0,#cfcfd4 22%,#55555b 55%,#0a0a0c 100%);box-shadow:0 0 60px 6px rgba(255,255,255,.35)}
.nogl #orbfb{display:block}
.nogl #orbfb.off{display:none}
#fx{z-index:2;pointer-events:none}

#stage{position:fixed;inset:0;z-index:1;overflow:hidden}
#stage.col{overflow-y:auto;-webkit-overflow-scrolling:touch}
#blobs{display:block;position:absolute;left:0;top:0}
.blob{cursor:pointer;outline:none}
.blob .fill{fill:#0a0a0c}
.blob .line{fill:none;stroke:#fff;stroke-width:1.6}
.blob .g1{fill:none;stroke:#fff;stroke-width:6;opacity:.14}
.blob .g2{fill:none;stroke:#fff;stroke-width:14;opacity:.05}
#labels{position:absolute;left:0;top:0;pointer-events:none}
.cap{position:absolute;left:0;top:0;white-space:nowrap;background:rgba(0,0,0,.82);padding:4px 9px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--dim);opacity:0;transition:opacity .2s;text-align:center}
.cap b{color:var(--ink);font-weight:500;margin-right:.7em}
.cap.on{opacity:1}
.ph{position:absolute;left:0;top:0;text-align:center;font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;line-height:.98;letter-spacing:.01em;text-wrap:balance;text-shadow:0 2px 18px #000,0 0 3px #000}
.ph small{display:block;margin-top:.7em;font-family:var(--mono);font-weight:400;font-stretch:100%;font-size:.3em;letter-spacing:.16em;color:#d6d6dc}

/* intro title */
#title{position:fixed;z-index:5;left:0;right:0;margin:0;text-align:center;pointer-events:none;
  font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(26px,6.4vw,96px);letter-spacing:.035em;line-height:1;white-space:nowrap;
  --g:.25;text-shadow:calc(var(--g)*-22px) 0 0 rgba(255,255,255,.32),calc(var(--g)*26px) 0 0 rgba(255,255,255,.22),0 0 calc(var(--g)*30px) rgba(255,255,255,.35);
  transition:opacity .25s,transform .45s cubic-bezier(.2,.7,.2,1)}
#title.gone{opacity:0;transform:scale(1.5)}
#hint{position:fixed;z-index:5;left:0;right:0;text-align:center;pointer-events:none;font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);opacity:0;transition:opacity .4s}
#hint.on{opacity:1;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

#mark{position:fixed;z-index:6;left:20px;top:18px;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:opacity .4s}
#mark.on{opacity:1;pointer-events:auto}
#mark:hover{text-shadow:-3px 0 0 rgba(255,255,255,.35),4px 0 0 rgba(255,255,255,.25)}

footer{position:fixed;z-index:6;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:center;gap:14px;
  font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--dim);background:linear-gradient(to top,#000 35%,transparent)}
footer button,footer a{color:var(--dim);text-decoration:none;padding:6px 4px}
footer button:hover,footer a:hover{color:var(--ink)}
footer i{font-style:normal;color:var(--faint)}

/* game card */
#card{position:fixed;z-index:4;left:0;top:0;width:600px;transform-origin:0 0;opacity:0;pointer-events:none;display:flex;flex-direction:column;gap:14px}
#card.live{pointer-events:auto}
#card .x{position:absolute;z-index:2;right:-10px;top:-10px;width:36px;height:36px;border-radius:50%;background:#000;border:1.5px solid #fff;font-size:20px;line-height:1;display:grid;place-items:center}
#card .x:hover{background:#fff;color:#000}
.media{position:relative;display:block;aspect-ratio:16/9;background:#000;border:1px solid rgba(255,255,255,.28);overflow:hidden;text-decoration:none}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;padding:12px 20px 12px 16px;background:rgba(0,0,0,.72);border:1.5px solid #fff;border-radius:999px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:background .15s,color .15s}
.media .play i{width:0;height:0;border-left:13px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
a.media:hover .play{background:#fff;color:#000}
.media .soon{position:absolute;left:12px;bottom:12px;padding:6px 10px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.4);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#d6d6dc}
#card h2{margin:4px 0 0;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
#card .hook{margin:0;font-size:17px;line-height:1.45;color:#e4e4e8;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:5px 10px;border:1px solid rgba(255,255,255,.4);border-radius:999px;color:#e4e4e8}
.tags li.st{background:#fff;color:#000;border-color:#fff}
.bar{display:flex;align-items:center;gap:16px;padding:14px 14px 14px 18px;border:1.5px solid #fff;background:rgba(0,0,0,.55);text-decoration:none;transition:box-shadow .2s,background .2s}
a.bar:hover{background:#000;box-shadow:0 0 0 1px #fff,0 0 26px rgba(255,255,255,.35)}
.bar .logo{height:34px;width:auto;flex:none}
.bar span{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bar b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.bar em{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--dim)}
.bar strong,.bar .btn{flex:none;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:13px 16px;background:#fff;color:#000;text-decoration:none}
.bar i{font-style:normal;display:inline-block;transition:transform .2s}
a.bar:hover i,.bar .btn:hover i{transform:translateX(4px)}
.more{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:-6px}
.more a:hover{color:#fff}

/* phone: card becomes a full-screen sheet */
#card.sheet{inset:0;width:auto;transform:none !important;overflow-y:auto;background:#050506;padding:64px 18px 84px;z-index:7;transition:opacity .25s}
#card.sheet .x{position:fixed;right:14px;top:14px}
#card.sheet h2{font-size:24px}
#card.sheet .bar{flex-wrap:wrap}
#card.sheet .bar strong,#card.sheet .bar .btn{flex:1 1 100%;text-align:center}

/* press and contact panel */
#veil{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
#veil.on{display:flex}
#panel{width:min(440px,100%);background:var(--panel);border:1.5px solid #fff;padding:26px 24px 24px;position:relative;box-shadow:0 0 40px rgba(255,255,255,.12)}
#panel h3{margin:0 0 10px;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
#panel p{margin:0 0 16px;line-height:1.5;color:#d6d6dc}
#panel .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
#panel .addr{font-family:var(--mono);font-size:14px;word-break:break-all}
#panel .pill{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:8px 12px;border:1px solid rgba(255,255,255,.5);text-decoration:none}
#panel .pill:hover{background:#fff;color:#000}
#panel .x{position:absolute;right:10px;top:8px;font-size:22px;width:32px;height:32px}

.shake{animation:shake .45s linear}
@keyframes shake{10%{transform:translate(-9px,5px)}25%{transform:translate(8px,-7px)}40%{transform:translate(-6px,-4px)}55%{transform:translate(5px,6px)}70%{transform:translate(-3px,2px)}85%{transform:translate(2px,-2px)}}
@media (max-width:759px){
  footer{gap:7px;font-size:12px;letter-spacing:.02em}
  #mark{left:16px;top:16px;font-size:13px}
  .cap{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .shake,#hint.on{animation:none}
  *{transition:none !important}
}
</style>
</head>
<body>
<canvas id="orb" aria-hidden="true"></canvas>
<div id="orbfb" aria-hidden="true"></div>

<main id="stage">
  <svg id="blobs" role="presentation" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="labels" aria-hidden="true"></div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<h1 id="title">SUDDEN MAYHEM</h1>
<div id="hint" aria-hidden="true">Click it</div>
<button id="mark" type="button" title="Replay the intro">SUDDEN MAYHEM</button>

<nav class="sr" aria-label="Games" id="gamenav"></nav>
<article id="card" aria-live="polite"></article>

<footer>
  <button type="button" data-act="games">Games</button><i>·</i>
  <button type="button" data-act="press">Press</button><i>·</i>
  <button type="button" data-act="contact">Contact</button><i>·</i>
  <a href="https://discord.com/invite/PUk2BwPUpM" target="_blank" rel="noopener">Discord</a><i>·</i>
  <button type="button" data-act="sound" aria-pressed="true">Sound on</button>
</footer>

<div id="veil"><div id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle"></div></div>

<script>
(() => {
'use strict';

/* ───────── Settings you can edit ───────── */
const CFG = {
  clicksToBlow: 3,        // clicks on the orb before it explodes
  autoBlowMs: 10000,      // explodes on its own after this long with no click
  email: 'mani@mayawisoftware.com',
  discord: 'https://discord.com/invite/PUk2BwPUpM',
  steamLogo: ''           // put Valve's official logo file in /assets and write its path here, e.g. 'assets/steam.svg'
};

/* Games in priority order: the first is the biggest blob.
   To add a game, copy one entry, put its image in /assets and adjust the fields. */
const GAMES = [
  { slug:'huntin-buddies', title:"Huntin' Buddies", img:'assets/hb.jpg',
    hook:'1-4 player online horror comedy hunting game set in a forbidden national park.',
    tags:['1-4 Players','Online Co-op'], status:'Out now', released:true,
    steam:{ id:4383880, url:'https://store.steampowered.com/app/4383880/Huntin_Buddies/' },
    trailer:{ yt:'T0n-pTNVLlg' } },
  { slug:'no-dad-i-am-not-drunk', title:'No Dad I Am Not Drunk', img:'assets/ph1.jpg', placeholder:true,
    hook:"Dad's home early. You're drunk. Do every chore he asks and never get found out.",
    tags:['Physics comedy'], status:'Announcing soon', steam:null, trailer:null },
  { slug:'welcome-to-earth', title:'Welcome to Earth', img:'assets/ph2.jpg', placeholder:true,
    hook:'A million aliens are heading for the highway. Place your defences and hold the town.',
    tags:['Swarm defence'], status:'Announcing soon', steam:null, trailer:null },
  { slug:'rick-rack', title:'Rick Rack', img:'assets/rr.jpg',
    hook:'Rick Rack uses time loop very delicately, each day all drivers drive out to their destinations at the same time.',
    tags:['Single-player','Time-loop driving'], status:'Out now', released:true,
    steam:{ id:1064050, url:'https://store.steampowered.com/app/1064050/Rick_Rack/' },
    trailer:{ yt:'ImV72b9kHQc' } },
  { slug:'the-last-king', title:'The Last King', img:'assets/tlk.jpg',
    hook:'Command a fearless Greek army against Persian invasion. Recruit, train, and promote your army.',
    tags:['Single-player','Wargame'], status:'Early Access', released:true,
    steam:{ id:2307400, url:'https://store.steampowered.com/app/2307400/The_Last_King/' },
    trailer:{ yt:'oLv2MQryeAw' } },
  { slug:'knightwatch', title:'Knightwatch', img:'assets/kw.jpg',
    hook:'By day, build defenses and towers. By night, grab the weapon of your choice and fight off relentless waves of zombies.',
    tags:['Single-player','First-person tower defense'], status:'Coming 2027',
    steam:{ id:3783840, url:'https://store.steampowered.com/app/3783840/Knightwatch/' },
    trailer:{ yt:'i6_shJkliMU' } },
  { slug:'heroes-must-diee', title:'Heroes Must Diee', img:'assets/hmd.jpg',
    hook:'Tired of quest going, monster killing "Heroes" who keep raiding your house for household items.',
    tags:['Single-player','Tower defense RTS'], status:'Coming soon',
    steam:{ id:1297440, url:'https://store.steampowered.com/app/1297440/Heroes_Must_Diee/' },
    trailer:{ yt:'OZOm630CH2Y' } },
  { slug:'worldwasgray', title:'WorldWasGray', img:'assets/wwg.jpg',
    hook:'A relaxing game about painting a gray world back to life.',
    tags:['Single-player','Relaxing sandbox'], status:'Coming Q1 2027',
    steam:{ id:3783630, url:'https://store.steampowered.com/app/3783630/WorldWasGray/' },
    trailer:{ drive:'1Rwn59gmwYNLJrCRWJEjMd_8yQIG7Qkp6' } }
];
const SIZE = [1, .82, .76, .66, .62, .58, .54, .5];   // blob size by priority; later games use the last value

/* ───────── Setup ───────── */
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const stage = $('#stage'), svg = $('#blobs'), labels = $('#labels'), fxC = $('#fx'), orbC = $('#orb'), orbFb = $('#orbfb');
const titleEl = $('#title'), hintEl = $('#hint'), markEl = $('#mark'), card = $('#card'), veil = $('#veil'), panel = $('#panel');
const fx = fxC.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let FRAMED = false; try { FRAMED = window.self !== window.top; } catch (e) { FRAMED = true; }
const EMBED = !FRAMED && location.protocol !== 'file:';   // the YouTube player needs a real web address: it refuses to play from a preview frame or a file opened from disk
const TOUCH = matchMedia('(hover: none)').matches;
const ASP = 1.6, FOOT = 52, TOP = 58;
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

let W = 0, H = 0, mobile = false, stageH = 0, dprFx = 1;
let phase = 'intro';      // intro | menu
let openIdx = -1;
let cardGeo = null;       // {cx, cy, A, B, scale}
let clicks = 0, lastTouch = performance.now(), crack = .25, crackT = .25, burst = 0, bursting = false, shakeV = 0;
let orbX = 0, orbY = 0, orbR = 0;

/* ───────── Blobs ───────── */
const blobs = GAMES.map((g, i) => {
  const el = document.createElementNS(NS, 'g');
  el.setAttribute('class', 'blob');
  el.innerHTML =
    `<clipPath id="clip${i}"><path/></clipPath>` +
    `<path class="fill"/>` +
    `<image clip-path="url(#clip${i})" preserveAspectRatio="xMidYMid slice" href="${g.img}"/>` +
    `<path class="g2"/><path class="g1"/><path class="line"/>`;
  svg.appendChild(el);
  const paths = el.querySelectorAll('path');
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = `<b>${esc(g.title)}</b>${esc(g.status)}`;
  labels.appendChild(cap);
  let ph = null;
  if (g.placeholder) {
    ph = document.createElement('div');
    ph.className = 'ph';
    ph.innerHTML = `${esc(g.title)}<small>${esc(g.status)}</small>`;
    labels.appendChild(ph);
  }
  const b = {
    i, g, el, paths, img: el.querySelector('image'), cap, ph,
    x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0,
    s: 0, sT: 0, e: 0, eT: 0, hover: 0, hoverT: 0, delay: 0,
    p: [rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28)],
    a: [rnd(.045, .075), rnd(.035, .06), rnd(.02, .035), rnd(.01, .02)],
    w: [rnd(.35, .6), rnd(.3, .55), rnd(.4, .7), rnd(.5, .9)],
    dp: rnd(0, 6.28)
  };
  el.addEventListener('pointerenter', () => {
    if (TOUCH) return; b.hoverT = 1;
    const now = performance.now();
    if (phase === 'menu' && openIdx !== i && now - lastHover > 110 && now - menuAt > 1600) { lastHover = now; play('hover' + (1 + Math.floor(Math.random() * 3)), .5); }
  });
  el.addEventListener('pointerleave', () => { b.hoverT = 0; });
  el.addEventListener('click', ev => { ev.stopPropagation(); if (phase === 'menu' && openIdx !== i) go(g.slug); });
  return b;
});

/* real links for keyboards, screen readers and search engines */
$('#gamenav').innerHTML = GAMES.map(g => `<a href="#${g.slug}">${esc(g.title)}: ${esc(g.hook)}</a>`).join('');
$('#gamenav').querySelectorAll('a').forEach((a, i) => {
  a.addEventListener('focus', () => { if (phase === 'intro') skipIntro(); blobs[i].hoverT = 1; });
  a.addEventListener('blur', () => { blobs[i].hoverT = 0; });
});

/* ───────── Layout ───────── */
function region() {
  if (openIdx >= 0 && !mobile && cardGeo) return { x0: cardGeo.cx + cardGeo.A + 18, x1: W - 14, y0: TOP, y1: H - FOOT - 6 };
  return { x0: 14, x1: W - 14, y0: TOP, y1: H - FOOT - 6 };
}
function layout() {
  W = innerWidth; H = innerHeight; mobile = W < 760;
  stage.classList.toggle('col', mobile);
  card.classList.toggle('sheet', mobile);
  orbR = Math.min(W, H) * (mobile ? .26 : .21);
  orbX = W / 2; orbY = H * (mobile ? .4 : .41);
  titleEl.style.top = Math.round(orbY + orbR + Math.max(24, H * .05)) + 'px';
  hintEl.style.top = Math.round(orbY + orbR + Math.max(24, H * .05) + titleEl.offsetHeight + 22) + 'px';
  orbFb.style.cssText = `left:${orbX - orbR}px;top:${orbY - orbR}px;width:${orbR * 2}px;height:${orbR * 2}px`;

  if (mobile) {
    let y = TOP + 20;
    blobs.forEach((b, k) => {
      const rx = Math.max(W * .3, W * (.41 - k * .014)), ry = rx / ASP;
      b.sT = ry; y += ry; b.tx = W / 2 + (k % 2 ? 1 : -1) * W * .06; b.ty = y; y += ry + 52;
    });
    stageH = y + FOOT + 30;
  } else {
    stageH = H;
    if (openIdx >= 0) computeCard();
    const r = region(), rw = Math.max(120, r.x1 - r.x0), rh = r.y1 - r.y0;
    const free = blobs.filter(b => b.i !== openIdx);
    let sum = 0; free.forEach((b, k) => { b.wt = SIZE[Math.min(k, SIZE.length - 1)]; sum += b.wt * b.wt; });
    let k = Math.sqrt((openIdx >= 0 ? .36 : .43) * rw * rh / (Math.PI * ASP * sum));
    k = Math.min(k, rw * .47 / ASP, rh * .3);
    free.forEach(b => { b.sT = k * b.wt; });
  }
  svg.setAttribute('width', W); svg.setAttribute('height', stageH);
  svg.setAttribute('viewBox', `0 0 ${W} ${stageH}`);
  labels.style.width = W + 'px'; labels.style.height = stageH + 'px';
  dprFx = Math.min(devicePixelRatio || 1, 2);
  fxC.width = Math.round(W * dprFx); fxC.height = Math.round(H * dprFx);
  const d = Math.min(devicePixelRatio || 1, 1.5);
  orbC.width = Math.round(W * d); orbC.height = Math.round(H * d); orbC._d = d;
  blobs.forEach(b => { if (b.ph) b.ph.style.width = 'auto'; });
}

function computeCard() {

  src.connect(g); g.connect(master); src.start();
}
function startIdle() {
  if (!gesture || idleSrc || idleTag || phase !== 'intro' || bursting) return;
  if (!buf.idle) {
    if (!tag.idle) return;
    idleTag = tag.idle; idleTag.loop = true; idleTag.volume = .6; idleTag.muted = muted;
    try { idleTag.currentTime = IDLE_LOOP[0]; const pr = idleTag.play(); if (pr) pr.catch(() => {}); } catch (e) {}
    return;
  }
  idleSrc = actx.createBufferSource(); idleGain = actx.createGain();
  idleSrc.buffer = buf.idle; idleSrc.loop = true; idleSrc.loopStart = IDLE_LOOP[0]; idleSrc.loopEnd = IDLE_LOOP[1];
  idleGain.gain.setValueAtTime(0, actx.currentTime); idleGain.gain.linearRampToValueAtTime(.6, actx.currentTime + .6);
  idleSrc.connect(idleGain); idleGain.connect(master); idleSrc.start(0, IDLE_LOOP[0]);
}
function stopIdle() {
  if (idleTag) { try { idleTag.pause(); } catch (e) {} idleTag = null; }
  if (!idleSrc) return;
  const src = idleSrc, g = idleGain; idleSrc = idleGain = null;
  try { g.gain.cancelScheduledValues(actx.currentTime); g.gain.setValueAtTime(g.gain.value, actx.currentTime); g.gain.linearRampToValueAtTime(0, actx.currentTime + .25); src.stop(actx.currentTime + .3); } catch (e) {}
}
function setMuted(m) {
  muted = m; try { localStorage.setItem('sm-muted', m ? '1' : '0'); } catch (e) {}
  if (master) master.gain.value = m ? 0 : 1;
  if (idleTag) idleTag.muted = m;
  const btn = document.querySelector('[data-act="sound"]'); if (btn) { btn.textContent = m ? 'Sound off' : 'Sound on'; btn.setAttribute('aria-pressed', String(!m)); }
}

/* ───────── Intro and explosion ───────── */
function hit() {
  if (phase !== 'intro' || bursting) return;
  clicks++; lastTouch = performance.now();
  if (clicks >= CFG.clicksToBlow) return detonate();
  play('click', .9, 1 + (clicks - 1) * .1);
  crackT = Math.min(.95, .25 + clicks * (.7 / (CFG.clicksToBlow - 1)) * .9);
  shakeV = 1; edgeSparks(40, 420);
  titleEl.style.setProperty('--g', (.25 + clicks * .3).toFixed(2));
  hintEl.textContent = clicks >= CFG.clicksToBlow - 1 ? 'Once more' : 'Again';
}
function detonate() {
  if (bursting || phase !== 'intro') return;
  bursting = true; flash = 1; shakeV = 1.5;
  stopIdle(); play('boom', 1);
  hintEl.classList.remove('on'); titleEl.classList.add('gone');
  sparkBurst(orbX, orbY, 190, 1250, 1.3);
  for (let i = 0; i < 30; i++) { const a = rnd(0, 6.2832), v = rnd(260, 980), l = rnd(.8, 1.7); shards.push({ x: orbX + Math.cos(a) * orbR * .6, y: orbY + Math.sin(a) * orbR * .6, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, a: rnd(0, 6), va: rnd(-9, 9), r: rnd(5, 22), l, m: l, c: Math.random() < .5 ? '#fff' : '#b9b9c2' }); }
  for (let i = 0; i < 16; i++) { const a = rnd(0, 6.2832), v = rnd(60, 420), l = rnd(1.2, 2.6); puffs.push({ x: orbX, y: orbY, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(40, 110), gr: rnd(40, 110), l, m: l }); }
  rings.push({ x: orbX, y: orbY, r0: orbR, r1: Math.hypot(W, H) * .7, l: .7, m: .7 });
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  setTimeout(() => {
    phase = 'menu'; menuAt = performance.now(); markEl.classList.add('on');
    blobs.forEach((b, k) => {
      const a = rnd(0, 6.2832), v = k ? rnd(500, 1150) : 0;
      b.x = orbX; b.y = orbY; b.s = 0; b.vx = Math.cos(a) * v; b.vy = Math.sin(a) * v * .7; b.delay = k * .035;
      if (mobile) { b.x = b.tx; b.y = orbY; }
    });
    try { sessionStorage.setItem('sm-intro', '1'); } catch (e) {}
  }, 110);
  setTimeout(() => { orbC.classList.add('off'); orbFb.classList.add('off'); bursting = false; burst = 0; }, 720);
}
function skipIntro() {
  if (phase !== 'intro') return;
  phase = 'menu'; bursting = false; stopIdle();
  orbC.classList.add('off'); orbFb.classList.add('off'); titleEl.classList.add('gone'); hintEl.classList.remove('on'); markEl.classList.add('on');
  const r = region();
  blobs.forEach(b => { b.delay = 0; b.s = b.sT; const sp = b.i ? 1 : 0; b.x = mobile ? b.tx : (r.x0 + r.x1) / 2 + rnd(-200, 200) * sp; b.y = mobile ? b.ty : (r.y0 + r.y1) / 2 + rnd(-120, 120) * sp; b.vx = b.vy = 0; });
  if (!mobile) for (let i = 0; i < 400; i++) step(1 / 60, 0);
}
function replayIntro() {
  if (REDUCED) return;
  if (openIdx >= 0) setOpen(-1);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  stage.scrollTop = 0;
  phase = 'intro'; clicks = 0; crack = crackT = .25; burst = 0; bursting = false; lastTouch = performance.now();
  orbC.classList.remove('off'); orbFb.classList.remove('off'); titleEl.classList.remove('gone'); titleEl.style.setProperty('--g', '.25');
  hintEl.textContent = TOUCH ? 'Tap it' : 'Click it'; hintEl.classList.add('on'); markEl.classList.remove('on');
  startIdle();
}

/* ───────── Game card ───────── */
function trailerUrl(g) { return g.trailer.yt ? `https://www.youtube.com/watch?v=${g.trailer.yt}` : `https://drive.google.com/file/d/${g.trailer.drive}/view`; }
function trailerEmbed(g) { return g.trailer.yt ? `https://www.youtube.com/embed/${g.trailer.yt}?autoplay=1&rel=0` : `https://drive.google.com/file/d/${g.trailer.drive}/preview`; }
function fillCard(g) {
  const cta = g.released ? 'Get it on Steam' : 'Wishlist on Steam';
  const media = g.trailer
    ? `<a class="media" href="${trailerUrl(g)}" target="_blank" rel="noopener" data-trailer><img src="${g.img}" alt="${esc(g.title)} key art"><span class="play"><i></i>Play trailer</span></a>`
    : `<div class="media"><img src="${g.img}" alt=""><span class="soon">Trailer coming soon</span></div>`;
  let steam;
  if (!g.steam) steam = `<div class="bar"><span><b>Steam page coming soon</b><em>Join the Discord to hear first</em></span><a class="btn" href="${CFG.discord}" target="_blank" rel="noopener">Join Discord <i>→</i></a></div>`;
  else steam = `<a class="bar" href="${g.steam.url}" target="_blank" rel="noopener">${CFG.steamLogo ? `<img class="logo" src="${CFG.steamLogo}" alt="Steam">` : ''}<span><b>${cta}</b><em>${esc(g.status)}</em></span><strong>Open Steam <i>→</i></strong></a>`;
  card.innerHTML =
    `<button class="x" type="button" aria-label="Close">×</button>${media}` +
    `<h2>${esc(g.title)}</h2><p class="hook">${esc(g.hook)}</p>` +
    `<ul class="tags"><li class="st">${esc(g.status)}</li>${g.tags.map(t => `<li>${esc(t)}</li>`).join('')}</ul>${steam}`;
  card.querySelector('.x').addEventListener('click', () => go(''));

  const tr = card.querySelector('[data-trailer]');
  if (tr && EMBED) tr.addEventListener('click', ev => {
    ev.preventDefault();
    const box = document.createElement('div'); box.className = 'media';
    box.innerHTML = `<iframe src="${trailerEmbed(g)}" title="${esc(g.title)} trailer" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    tr.replaceWith(box);
  });
}
function setOpen(idx) {
  if (idx === openIdx) return;
  if (openIdx >= 0) blobs[openIdx].eT = 0;
  openIdx = idx;
  if (idx < 0) {
    card.classList.remove('live'); card.style.opacity = 0;
    setTimeout(() => { if (openIdx < 0) card.innerHTML = ''; }, 300);
    layout(); return;
  }
  const b = blobs[idx];
  fillCard(b.g); card.scrollTop = 0;
  if (mobile) { card.style.opacity = 1; card.classList.add('live'); }
  else { b.eT = 1; b.hoverT = 0; svg.appendChild(b.el); card.style.opacity = 0; if (!REDUCED) { const p = [b.x, b.y - stage.scrollTop]; sparkBurst(p[0], p[1], 40, 520, .7); } }
  layout();
}
function go(slug) {
  if (('#' + slug) === location.hash || (!slug && !location.hash)) return route();
  try { if (slug) location.hash = slug; else history.pushState(null, '', location.pathname + location.search); } catch (e) { try { location.hash = slug; } catch (e2) {} }
  route(slug);
}
function route(force) {
  const slug = typeof force === 'string' ? force : decodeURIComponent(location.hash.slice(1));
  const idx = GAMES.findIndex(g => g.slug === slug);
  if (idx >= 0 && phase === 'intro') skipIntro();
  setOpen(idx);
}

/* ───────── Press and contact ───────── */
function openPanel(kind) {
  const intro = kind === 'press'
    ? `<h3 id="ptitle">Press</h3><p>Press kits are being put together. For keys, art, or an interview, write to us and you'll get a reply from a person.</p>`
    : `<h3 id="ptitle">Contact</h3><p>Business, publishing, creators, or just to say a game broke in a funny way.</p>`;
  panel.innerHTML = `<button class="x" type="button" aria-label="Close">×</button>${intro}` +
    `<div class="row"><span class="addr">${CFG.email}</span><button class="pill" type="button" data-copy>Copy</button><a class="pill" href="mailto:${CFG.email}">Open mail</a></div>` +
    `<div class="row"><a class="pill" href="${CFG.discord}" target="_blank" rel="noopener">Join the Discord ↗</a></div>`;
  panel.querySelector('.x').addEventListener('click', closePanel);
  panel.querySelector('[data-copy]').addEventListener('click', ev => {
    const btn = ev.currentTarget;
    const done = ok => { btn.textContent = ok ? 'Copied' : 'Select and copy'; };
    try { navigator.clipboard.writeText(CFG.email).then(() => done(true), () => done(false)); } catch (e) { done(false); }
  });
  veil.classList.add('on'); panel.querySelector('.x').focus();
}
function closePanel() { veil.classList.remove('on'); }
veil.addEventListener('click', ev => { if (ev.target === veil) closePanel(); });
document.querySelector('footer').addEventListener('click', ev => {
  const act = ev.target.dataset && ev.target.dataset.act; if (!act) return;
  if (act === 'sound') return setMuted(!muted);
  if (phase === 'intro') skipIntro();
  if (act === 'games') { go(''); stage.scrollTop = 0; shock(W / 2, H / 2); } else openPanel(act);
});

/* ───────── Input ───────── */
function shock(x, y) {
  if (REDUCED || mobile) return;
  rings.push({ x, y, r0: 6, r1: 420, l: .55, m: .55 }); sparkBurst(x, y, 26, 420, .6);
  for (const b of blobs) { if (b.eT === 1) continue; const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy) || 1, f = 90000 / (d + 140); b.vx += dx / d * f; b.vy += dy / d * f; }
}
['pointerdown', 'mousedown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(n => addEventListener(n, unlock, true));   // different browsers accept different events as the visitor's first action
addEventListener('pointerdown', ev => {
  if (phase !== 'intro' || bursting) return;
  if (ev.target.closest('footer,#veil,.sr')) return;
  hit();
});
stage.addEventListener('click', ev => {
  if (phase !== 'menu' || ev.target.closest('.blob')) return;
  if (openIdx >= 0) go(''); else shock(ev.clientX, ev.clientY);
});
addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (veil.classList.contains('on')) closePanel(); else if (openIdx >= 0) go(''); return; }
  if (phase === 'intro' && (ev.key === 'Enter' || ev.key === ' ') && !ev.target.closest('footer,#veil')) { ev.preventDefault(); hit(); }
});
addEventListener('wheel', () => { if (phase === 'intro') detonate(); }, { passive: true });
addEventListener('hashchange', () => route());
addEventListener('popstate', () => route());
markEl.addEventListener('click', replayIntro);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layout(); if (openIdx >= 0 && !mobile) { computeCard(); layout(); } }, 80); });

/* ───────── Loop ───────── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.034, (now - last) / 1000), t = now / 1000; last = now;
  if (phase === 'intro') {
    crack += (crackT - crack) * (1 - Math.exp(-dt * 6));
    if (idleGain && actx.currentTime > .7) idleGain.gain.setTargetAtTime(.45 + .5 * crack, actx.currentTime, .2);
    if (idleTag) idleTag.volume = Math.min(1, .45 + .5 * crack);
    if (bursting) burst = Math.min(1, burst + dt * 1.9);
    else if (now - lastTouch > CFG.autoBlowMs) detonate();
    if (!bursting && !REDUCED) titleEl.style.transform = `translate(${(rnd(-1, 1) * crack * 5 * (Math.random() < .25 ? 1 : 0)).toFixed(1)}px,0)`;
  } else if (bursting) burst = Math.min(1, burst + dt * 1.9);
  shakeV *= Math.exp(-dt * 5);
  if (!orbC.classList.contains('off')) drawOrb(t);
  step(dt, t); draw(t); drawFx(dt, t);
  requestAnimationFrame(frame);
}

/* ───────── Start ───────── */
initOrb();
initAudio(); setMuted(muted);
layout();
let seen = false; try { seen = sessionStorage.getItem('sm-intro') === '1'; } catch (e) {}
const startSlug = decodeURIComponent(location.hash.slice(1));
if (REDUCED || seen || GAMES.some(g => g.slug === startSlug)) { skipIntro(); route(); }
else { blobs.forEach(b => { b.x = orbX; b.y = orbY; }); hintEl.textContent = TOUCH ? 'Tap it' : 'Click it'; setTimeout(() => { if (phase === 'intro' && !bursting) hintEl.classList.add('on'); }, 900); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); if (openIdx >= 0 && !mobile) { computeCard(); layout(); } });
requestAnimationFrame(frame);
})();
</script>
